<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Tsinjo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            border: 2px solid #ccc;
            border-radius: 20px;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        form {
            border: 1px dashed #aaa;
            padding: 15px;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 5px;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .historique {
            margin-top: 30px;
        }
        .historique ul {
            padding-left: 20px;
        }
    </style>
</head>
<body>

<h1>Tsinjo</h1>

<form th:action="@{/donation}" method="post">
    <label for="donorName">Nom complet</label>
    <input type="text" id="donorName" name="donorName" required />

    <label for="donorEmail">Email</label>
    <input type="email" id="donorEmail" name="donorEmail" required />

    <label for="amount">Montant (€)</label>
    <input type="number" step="0.01" min="0" id="amount" name="amount" required />

    <label for="paymentMethod">Moyen de paiement</label>
    <input type="text" id="paymentMethod" name="paymentMethod" required />

    <label for="paymentId">Référence de paiement (pspPaymentId)</label>
    <input type="text" id="paymentId" name="paymentId" required />

    <button type="submit">Donner !</button>
</form>

<div class="historique">
    <h2>Historique des dons et aides</h2>
    <ul>
        <li th:each="evt : ${events}">
            <span th:text="${evt instanceof T(com.hei.school.model.Donation) ? 'Don' : 'Aide'}"></span> -
            <span th:text="${evt instanceof T(com.hei.school.model.Donation) ? evt.donor.name : evt.beneficiary.name}"></span> :
            <span th:text="${evt.amount}"></span> €,
            <span th:text="${#dates.format(evt.date, 'dd/MM/yyyy HH:mm')}"></span>,
            <span th:text="${evt instanceof T(com.hei.school.model.Donation) ? evt.paymentMethod : evt.accidentDescription}"></span>
        </li>
    </ul>
</div>

</body>
</html>
